apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
data:
  PORT: "3000"
  LOG_LEVEL: "info"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "taskboard"
  DB_POOL_MAX: "5"
  SHUTDOWN_TIMEOUT_SEC: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: taskboard
  labels:
    app.kubernetes.io/part-of: taskboard
data:
  FRONTEND_PORT: "8080"
  BACKEND_URL: "http://backend:3000"
