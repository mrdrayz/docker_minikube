apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taskboard
  labels:
    app: frontend
    app.kubernetes.io/part-of: taskboard
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskboard
  labels:
    app: frontend
    app.kubernetes.io/part-of: taskboard
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: taskboard
    spec:
      containers:
        - name: frontend
          image: taskboard-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FRONTEND_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: frontend-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
